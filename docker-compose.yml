services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: protein_memo
      MYSQL_USER: protein
      MYSQL_PASSWORD: protein_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "protein", "-pprotein_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
